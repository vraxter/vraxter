syntax = "proto3";

package v1;
option go_package = "github.com/patagonicrune/vraxter/api/v1";

// AgentService manages the interaction between User Clients and The Brain
service AgentService {
  // Execute sends a natural language query and receives a stream of events
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);

  // GetInfo returns the current status and metadata of the Vraxter Engine
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);

  // ListHistory returns the most recent conversations
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);

  // GetConversation returns all messages for a specific conversation
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // --- Provider & Model Management ---

  // GetSupportedProviders returns all registered provider types (google, openai, etc.)
  rpc GetSupportedProviders(GetSupportedProvidersRequest) returns (GetSupportedProvidersResponse);

  // ConfigureProvider creates or updates a provider configuration
  rpc ConfigureProvider(ConfigureProviderRequest) returns (ConfigureProviderResponse);

  // ListProviders returns all configured providers
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);

  // DiscoverModels fetches available models from the provider's API
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);

  // RegisterModel saves a discovered model to the local database
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse);

  // ListModels returns all registered models, optionally filtered by provider
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string model_id = 1;
  string version = 2;
  string status = 3;
}

message ExecuteRequest {
  string query = 1;
  string conversation_id = 2;
  string specialist_id = 3;
  string model_id = 4;
}

message ExecuteResponse {
  enum Type {
    TOKEN = 0;        // Incremental text token
    TOOL_CALL = 1;    // The LLM wants to run a tool
    TOOL_RESULT = 2;  // Results from a tool execution
    ERROR = 3;        // Error during processing
    DONE = 4;         // Final completion marker
    PLAN_PROPOSAL = 5; // A multi-phase plan awaiting confirmation
    STATUS = 6;       // System status notice (e.g. Fallback alerts)
    SPECIALIST_RESULT = 7; // Sub-agent stream events
  }
  
  Type type = 1;
  string content = 2;      // Text content or JSON for tools
  string skill_id = 3;     // ID if it's a tool-related event
  string active_model_id = 4; // The model ID currently driving the execution
}

// --- History RPCs ---

message ListHistoryRequest {
  int32 limit = 1;
}

message ListHistoryResponse {
  repeated ConversationSummary conversations = 1;
}

message ConversationSummary {
  string id = 1;
  string title = 2;
  int32 message_count = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  repeated HistoryMessage messages = 1;
}

message HistoryMessage {
  string role = 1;
  string content = 2;
  string timestamp = 3;
}

// --- Management Messages ---

message GetSupportedProvidersRequest {}
message GetSupportedProvidersResponse {
  repeated string providers = 1;
}

message ConfigureProviderRequest {
  string name = 1;
  string type = 2; // e.g. "google", "openai"
  string api_key = 3;
  string base_url = 4;
}
message ConfigureProviderResponse {
  string provider_id = 1;
  string status = 2;
}

message ListProvidersRequest {}
message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
}

message ProviderInfo {
  string id = 1;
  string name = 2;
  string type = 3;
  bool is_configured = 4;
}

message DiscoverModelsRequest {
  string provider_id = 1; // Can be name or ID
}
message DiscoverModelsResponse {
  repeated string models = 1;
}

message RegisterModelRequest {
  string provider_id = 1;
  string model_name = 2;
  string alias = 3;
  int32 priority = 4;
}
message RegisterModelResponse {
  string model_id = 1;
}

message ListModelsRequest {
  string provider_id = 1; // Optional filter
}
message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  string id = 1;
  string provider_name = 2;
  string alias = 3;
  string model = 4;
  bool is_active = 5;
  int32 priority = 6;
}

