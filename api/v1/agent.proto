syntax = "proto3";

package v1;
option go_package = "github.com/patagonicrune/vraxter/api/v1";

// AgentService manages the interaction between User Clients and The Brain
service AgentService {
  // Execute sends a natural language query and receives a stream of events
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);

  // GetInfo returns the current status and metadata of the Vraxter Engine
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);

  // ListHistory returns the most recent conversations
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);

  // GetConversation returns all messages for a specific conversation
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // --- Provider & Model Management ---

  // GetSupportedProviders returns all registered provider types (google, openai, etc.)
  rpc GetSupportedProviders(GetSupportedProvidersRequest) returns (GetSupportedProvidersResponse);

  // ConfigureProvider creates or updates a provider configuration
  rpc ConfigureProvider(ConfigureProviderRequest) returns (ConfigureProviderResponse);

  // ListProviders returns all configured providers
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);

  // DiscoverModels fetches available models from the provider's API
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);

  // RegisterModel saves a discovered model to the local database
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse);

  // ListModels returns all registered models, optionally filtered by provider
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // --- Event Bus ---

  // SubscribeEvents opens a persistent, one-way stream from the engine to the client
  // used to push asynchronous background jobs and swarm notifications.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SystemEvent);

  // GetActiveJobs returns all currently tracked background daemons
  rpc GetActiveJobs(GetActiveJobsRequest) returns (GetActiveJobsResponse);

  // --- Configuration Management ---
  rpc GetConfig(GetConfigRequest) returns (ConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (ConfigResponse);

  // --- Skills & Hub Management ---
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc GetSkillInfo(GetSkillInfoRequest) returns (GetSkillInfoResponse);
  rpc InstallSkill(InstallSkillRequest) returns (InstallSkillResponse);
  rpc DownloadSkill(DownloadSkillRequest) returns (DownloadSkillResponse);
  rpc InjectSkill(InjectSkillRequest) returns (InjectSkillResponse);
  rpc InspectSkill(InspectSkillRequest) returns (InspectSkillResponse);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string model_id = 1;
  string version = 2;
  string status = 3;
  string capabilities = 7;
  int32 context_window = 8;
  string use_cases = 9;
}

// --- Configuration ---

message GetConfigRequest {}

message UpdateConfigRequest {
  optional string privacy_policy = 1;
  optional string hub_url = 2;
  optional bool require_skill_approval = 3;
}

message ConfigResponse {
  string privacy_policy = 1;
  string hub_url = 2;
  bool require_skill_approval = 3;
}

// --- Skills ---

message SkillInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string engine = 5;
  int32 tier = 6;
  float score = 7;
  bool is_official = 8;
  string checksum = 9;
  repeated string permissions = 10;
  int32 downloads = 11;
  bool has_params = 12;
}

message ListSkillsRequest {}
message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

message GetSkillInfoRequest {
  string id = 1;
}
message GetSkillInfoResponse {
  SkillInfo skill = 1;
  string schema = 2; // JSON schema for params
}

message InstallSkillRequest {
  string id = 1;
}
message InstallSkillResponse {
  bool success = 1;
  string message = 2;
}

message DownloadSkillRequest {
  string id = 1;
  string dest_path = 2;
  bool include_source = 3;
}
message DownloadSkillResponse {
  bool success = 1;
  string message = 2;
}

message InjectSkillRequest {
  string file_path = 1;
}
message InjectSkillResponse {
  bool success = 1;
  string message = 2;
  string skill_id = 3;
}

message InspectSkillRequest {
  string id = 1;
}
message InspectSkillResponse {
  bool is_valid = 1;
  string expected_checksum = 2;
  string actual_checksum = 3;
  string message = 4;
}

message DeleteSkillRequest {
  string id = 1;
}
message DeleteSkillResponse {
  bool success = 1;
  string message = 2;
}

message ExecuteRequest {
  string query = 1;
  string conversation_id = 2;
  string specialist_id = 3;
  string model_id = 4;
  string source_zone = 5;
  string source_user = 6;
}

message ExecuteResponse {
  enum Type {
    TOKEN = 0;        // Incremental text token
    TOOL_CALL = 1;    // The LLM wants to run a tool
    TOOL_RESULT = 2;  // Results from a tool execution
    ERROR = 3;        // Error during processing
    DONE = 4;         // Final completion marker
    PLAN_PROPOSAL = 5; // A multi-phase plan awaiting confirmation
    STATUS = 6;       // System status notice (e.g. Fallback alerts)
    SPECIALIST_RESULT = 7; // Sub-agent stream events
    SKILL_APPROVAL_REQUEST = 8; // Emitted when a skill requires manual HITL approval
  }
  
  Type type = 1;
  string content = 2;      // Text content or JSON for tools
  string skill_id = 3;     // ID if it's a tool-related event
  string active_model_id = 4; // The model ID currently driving the execution
  string tool_payload = 5; // Raw JSON payload for tool calls or approvals
  string code_payload = 6; // Raw code payload for tools
}

// --- Event Bus Messages ---

message SubscribeEventsRequest {
  string client_id = 1; // Optional identifier for the subscribing client
}

message SystemEvent {
  enum EventType {
    JOB_STARTED = 0;
    JOB_COMPLETED = 1;
    JOB_FAILED = 2;
    SWARM_PROGRESS = 3;
    SYSTEM_ALERT = 4;
    PLAN_PROPOSED = 5;
  }
  
  EventType type = 1;
  string job_id = 2;
  string title = 3;
  string payload = 4; // JSON or text output
  string timestamp = 5;
}

message JobStatus {
  string id = 1;
  string title = 2;
  string status = 3;
  string start_time = 4;
}

message GetActiveJobsRequest {}

message GetActiveJobsResponse {
  repeated JobStatus jobs = 1;
}

// --- History RPCs ---

message ListHistoryRequest {
  int32 limit = 1;
}

message ListHistoryResponse {
  repeated ConversationSummary conversations = 1;
}

message ConversationSummary {
  string id = 1;
  string title = 2;
  int32 message_count = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  repeated HistoryMessage messages = 1;
}

message HistoryMessage {
  string role = 1;
  string content = 2;
  string timestamp = 3;
}

// --- Management Messages ---

message GetSupportedProvidersRequest {}
message GetSupportedProvidersResponse {
  repeated string providers = 1;
}

message ConfigureProviderRequest {
  string name = 1;
  string type = 2; // e.g. "google", "openai"
  string api_key = 3;
  string base_url = 4;
}
message ConfigureProviderResponse {
  string provider_id = 1;
  string status = 2;
}

message ListProvidersRequest {}
message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
}

message ProviderInfo {
  string id = 1;
  string name = 2;
  string type = 3;
  bool is_configured = 4;
}

message DiscoverModelsRequest {
  string provider_id = 1; // Can be name or ID
}
message DiscoverModelsResponse {
  repeated string models = 1;
}

message RegisterModelRequest {
  string provider_id = 1;
  string model_name = 2;
  string alias = 3;
  int32 priority = 4;
}
message RegisterModelResponse {
  string model_id = 1;
}

message ListModelsRequest {
  string provider_id = 1; // Optional filter
}
message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  string id = 1;
  string provider_name = 2;
  string alias = 3;
  string model = 4;
  bool is_active = 5;
  int32 priority = 6;
}

